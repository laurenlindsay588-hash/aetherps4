name: AetherPS4 iOS Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          set -euo pipefail

          command -v ninja >/dev/null || brew install ninja
          cmake --version
          ninja --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build FEXCore for iOS ARM64
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          FEX_SRC="$ROOT/runtime/sources/fexcore-darwin"
          FEX_BUILD="$ROOT/runtime/build/fexcore-ios-build"
          FEX_STAGE="$ROOT/runtime/build/shadps4-ios/fexcore-ios-libs"

          rm -rf "$FEX_BUILD"
          mkdir -p "$FEX_STAGE"

          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang)"
          CLANGXX="$(xcrun --sdk iphoneos --find clang++)"

          cmake -S "$FEX_SRC" -B "$FEX_BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_C_COMPILER="$CLANG" \
            -DCMAKE_CXX_COMPILER="$CLANGXX" \
            -DCMAKE_INSTALL_PREFIX="$FEX_BUILD/install" \
            -DBUILD_FEXCORE_ONLY=ON \
            -DBUILD_FEXCORE_SMOKE=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF \
            -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF \
            -DENABLE_LTO=OFF \
            -DENABLE_CCACHE=OFF \
            -DENABLE_GDB_SYMBOLS=OFF \
            -DENABLE_ZYDIS=OFF \
            -DENABLE_VIXL_DISASSEMBLER=OFF \
            -DENABLE_VIXL_SIMULATOR=OFF \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DENABLE_FEX_ALLOCATOR=ON \
            -DENABLE_OFFLINE_TELEMETRY=OFF \
            -DTUNE_CPU=none \
            -DTUNE_ARCH=generic

          cmake --build "$FEX_BUILD" \
            --target FEXCore FEXCore_Base Common CommonTools cpp-optparse JemallocLibs \
            --parallel

          find "$FEX_BUILD" -type f -name 'lib*.a' -exec cp -f {} "$FEX_STAGE/" \;

          REQUIRED_LIBS="
          libcpp-optparse.a
          libCommon.a
          libCommonTools.a
          libFEXCore.a
          libFEXCore_Base.a
          libJemallocLibs.a
          librpmalloc.a
          libfmt.a
          libtiny-json.a
          libxxhash.a
          libsoftfloat_3e.a
          libcephes_128bit.a
          "

          for lib in $REQUIRED_LIBS; do
            if [ ! -f "$FEX_STAGE/$lib" ]; then
              echo "ERROR: Missing $lib"
              exit 1
            fi
          done

      - name: Build shadps4 iOS static libraries
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang)"
          CLANGXX="$(xcrun --sdk iphoneos --find clang++)"
          BUILD="$ROOT/runtime/build/shadps4-ios"
          FEX_STAGE="$BUILD/fexcore-ios-libs"

          mkdir -p "$FEX_STAGE"

          cmake -S "$ROOT" -B "$BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.4 \
            -DCMAKE_C_COMPILER="$CLANG" \
            -DCMAKE_CXX_COMPILER="$CLANGXX" \
            -DCMAKE_FIND_ROOT_PATH="$IOS_SDK" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DENABLE_SHADPS4_IOS_LIB=ON \
            -DENABLE_FEX_GUEST_CPU=ON \
            -DENABLE_DISCORD_RPC=OFF \
            -DENABLE_UPDATER=OFF \
            -DENABLE_TESTS=OFF \
            -DFEXCORE_GUEST_CPU_SOURCE_DIR="$ROOT/runtime/sources/fexcore-darwin" \
            -DFEXCORE_GUEST_CPU_BUILD_DIR="$ROOT/runtime/build/fexcore-ios-build"

          cmake --build "$BUILD" --target shadps4_ios --parallel

          if [ ! -f "$BUILD/libshadps4_ios.a" ]; then
            found="$(find "$BUILD" -name libshadps4_ios.a -print -quit)"
            if [ -z "$found" ]; then
              echo "ERROR: libshadps4_ios.a was not produced"
              find "$BUILD" -name '*.a' | head -100
              exit 1
            fi
            cp -f "$found" "$BUILD/libshadps4_ios.a"
          fi

      - name: Stage libpng16 into Xcode search path
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          BUILD="$ROOT/runtime/build/shadps4-ios"
          PNG_STAGE="$BUILD/externals/libpng"
          PNG_SRC="$ROOT/externals/libpng"
          PNG_BUILD="$ROOT/runtime/build/libpng-ios-build"

          mkdir -p "$PNG_STAGE" "$BUILD"

          PNG_LIB="$(find "$BUILD" "$ROOT/runtime/build" -type f -name 'libpng16.a' ! -path '*/CMakeFiles/*' -print -quit || true)"

          if [ -z "$PNG_LIB" ]; then
            echo "libpng16.a not produced by shadPS4 CMake; building externals/libpng"
            if [ ! -d "$PNG_SRC" ]; then
              echo "ERROR: libpng source missing at $PNG_SRC"
              find "$ROOT" -maxdepth 4 -type d -iname '*png*' -print
              exit 1
            fi

            IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
            CLANG="$(xcrun --sdk iphoneos --find clang)"
            rm -rf "$PNG_BUILD"

            ZLIB_ARGS=()
            if [ -f "$BUILD/_deps/zlib-build/libz.a" ]; then
              ZLIB_ARGS+=(
                -DPNG_BUILD_ZLIB=OFF
                -DZLIB_LIBRARY="$BUILD/_deps/zlib-build/libz.a"
                -DZLIB_INCLUDE_DIR="$BUILD/_deps/zlib-src"
              )
            else
              ZLIB_ARGS+=(-DPNG_BUILD_ZLIB=ON)
            fi

            cmake -S "$PNG_SRC" -B "$PNG_BUILD" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_SYSTEM_PROCESSOR=arm64 \
              -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_C_COMPILER="$CLANG" \
              -DPNG_SHARED=OFF \
              -DPNG_STATIC=ON \
              -DPNG_TESTS=OFF \
              -DPNG_TOOLS=OFF \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              "${ZLIB_ARGS[@]}"

            cmake --build "$PNG_BUILD" --parallel
            PNG_LIB="$(find "$PNG_BUILD" -type f -name 'libpng16.a' -print -quit)"
          fi

          if [ -z "$PNG_LIB" ] || [ ! -f "$PNG_LIB" ]; then
            echo "ERROR: libpng16.a was not produced"
            find "$ROOT/runtime/build" -type f -name '*png*.a' -print
            exit 1
          fi

          cp -f "$PNG_LIB" "$PNG_STAGE/libpng16.a"
          cp -f "$PNG_LIB" "$BUILD/libpng16.a"
          ln -sfn libpng16.a "$PNG_STAGE/libpng.a"

          test -f "$PNG_STAGE/libpng16.a"
          test -d "$PNG_STAGE"
          echo "Staged libpng for Xcode:"
          ls -lh "$PNG_STAGE"/libpng*.a "$BUILD/libpng16.a"

      - name: Build iOS app
        run: |
          set -euo pipefail

          PNG_PATH="$GITHUB_WORKSPACE/runtime/build/shadps4-ios/externals/libpng/libpng16.a"
          if [ ! -f "$PNG_PATH" ]; then
            echo "ERROR: missing $PNG_PATH (Xcode -L path)"
            find "$GITHUB_WORKSPACE/runtime/build" -name '*png*' -print
            exit 1
          fi

          cd AetherPS4-iOS

          xcodebuild \
            -project AetherPS4-iOS.xcodeproj \
            -scheme AetherPS4-iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            LIBRARY_SEARCH_PATHS="$(PROJECT_DIR)/../runtime/build/shadps4-ios $(PROJECT_DIR)/../runtime/build/shadps4-ios/externals/libpng $(PROJECT_DIR)/../runtime/build/shadps4-ios/fexcore-ios-libs $(inherited)" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$GITHUB_WORKSPACE" \
            -type d \
            -path '*/Build/Products/Release-iphoneos/AetherPS4-iOS.app' \
            -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: AetherPS4-iOS.app was not found"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/ipa/Payload/AetherPS4-iOS.app"

          cd "$GITHUB_WORKSPACE/ipa"
          zip -r "$GITHUB_WORKSPACE/AetherPS4-iOS-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AetherPS4-iOS-unsigned
          path: AetherPS4-iOS-unsigned.ipa
          if-no-files-found: error

      - name: Upload FEXCore libraries
        uses: actions/upload-artifact@v4
        with:
          name: AetherPS4-FEXCore-iOS-libs
          path: runtime/build/shadps4-ios/fexcore-ios-libs/*.a
          if-no-files-found: error

      - name: Upload libpng
        uses: actions/upload-artifact@v4
        with:
          name: AetherPS4-libpng-iOS
          path: runtime/build/shadps4-ios/externals/libpng/libpng16.a
          if-no-files-found: error
